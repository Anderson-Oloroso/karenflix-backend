info:
  name: Update Director
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/directors/{{directorId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: json
    data: |-
      {
        "biography": "Biografía actualizada para comprobar el endpoint."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
