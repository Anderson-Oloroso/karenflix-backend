info:
  name: Create Director
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/directors"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: "Bearer {{token}}"
  body:
    type: json
    data: |-
      {
        "name": "Directora de ejemplo",
        "biography": "Biografía opcional del director para probar la API.",
        "photo_url": "https://example.com/director.jpg"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
