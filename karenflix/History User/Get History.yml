info:
  name: Get User Review History
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/history/{{userId}}"
  headers:
    - name: Authorization
      value: "Bearer {{jwt}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
