info:
  name: Delete Profile
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/auth/profile"
  headers:
    - name: Authorization
      value: "Bearer {{jwt}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
