info:
  name: Logout
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  headers:
    - name: Authorization
      value: "Bearer {{jwt}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
