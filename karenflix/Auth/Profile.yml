info:
  name: Profile
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/auth/profile"
  headers:
    - name: Authorization
      value: "Bearer {{jwt}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
