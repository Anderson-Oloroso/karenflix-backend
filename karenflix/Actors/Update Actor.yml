info:
  name: Update Actor
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/actors/{{actorId}}"
  headers:
    - name: Authorization
      value: "Bearer {{jwt}}"
  body:
    type: json
    data: |-
      {
        "biography": "Biografía actualizada con más de diez caracteres."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
