info:
  name: Create Category
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/categories"
  headers:
    - name: Authorization
      value: "Bearer {{jwt}}"
  body:
    type: json
    data: |-
      {
        "name": "Drama",
        "description": "Películas de drama"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
