info:
  name: Delete Category
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/categories/{{categoryId}}"
  headers:
    - name: Authorization
      value: "Bearer {{jwt}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
