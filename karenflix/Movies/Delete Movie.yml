info:
  name: Delete Movie
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/movies/{{movieId}}"
  headers:
    - name: Authorization
      value: "Bearer {{jwt}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
