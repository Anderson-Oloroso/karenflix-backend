info:
  name: Approve Movie
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/movies/{{movieId}}/approve"
  headers:
    - name: Authorization
      value: "Bearer {{jwt}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
