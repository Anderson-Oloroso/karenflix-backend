info:
  name: Update Movie Actor
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/movie-actors/{{movieActorId}}"
  headers:
    - name: Authorization
      value: "Bearer {{jwt}}"
  body:
    type: json
    data: |-
      {
        "character_name": "Personaje actualizado"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
