info:
  name: Delete User
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{baseUrl}}/users/{{userId}}"
  headers:
    - name: Authorization
      value: "Bearer {{jwt}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
